[workspace]
resolver = "3"
members = ["crates/mayu-core", "crates/mayu-redis", "crates/mayu-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mayu-core = { path = "crates/mayu-core" }
mayu-redis = { path = "crates/mayu-redis" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
redis = { version = "1.7", features = ["tokio-comp", "streams", "script", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
ulid = "3"
crossbeam-channel = "0.5"
thiserror = "2"
rand = "0.10"
tracing = "0.1"
proptest = "1.12"
pyo3 = "0.29"
