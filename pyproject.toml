[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mayu"
version = "0.1.0"
description = "A Python task queue with a Rust core, built for free-threaded Python"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
dependencies = ["msgpack>=1.1"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.30"]

[project.scripts]
mayu = "mayu.cli:main"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "opentelemetry-sdk>=1.30"]

[tool.maturin]
manifest-path = "crates/mayu-py/Cargo.toml"
python-source = "python"
module-name = "mayu._native"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
